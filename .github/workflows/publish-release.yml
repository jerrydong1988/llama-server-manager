name: Publish protected release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: protected-release-publisher
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.provenance.outputs.eligible }}
      release_tag: ${{ steps.provenance.outputs.release_tag }}
      release_version: ${{ steps.provenance.outputs.release_version }}
      release_date: ${{ steps.provenance.outputs.release_date }}
      source_sha: ${{ steps.provenance.outputs.source_sha }}
      publisher_sha: ${{ steps.provenance.outputs.publisher_sha }}
      build_workflow_sha256: ${{ steps.provenance.outputs.build_workflow_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify exact protected release provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          PUBLISHER_SHA: ${{ github.workflow_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo 'eligible=false' >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$PUBLISHER_SHA"
          run_metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '[.name, .path, .event, .status, .conclusion, .head_sha, .head_repository.full_name] | @tsv')"
          IFS=$'\t' read -r run_name run_path run_event run_status run_conclusion run_sha run_repository <<< "$run_metadata"
          if [[ "$run_name" != 'Build' || "$run_path" != '.github/workflows/build.yml' || "$run_event" != 'push' || "$run_status" != 'completed' || "$run_conclusion" != 'success' || "$run_sha" != "$SOURCE_SHA" || "$run_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo 'Source run does not satisfy the exact Build workflow provenance contract.' >&2
            exit 1
          fi
          git fetch --force origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch --force --tags origin
          if ! git rev-list --first-parent "refs/remotes/origin/$DEFAULT_BRANCH" | grep -Fx "$SOURCE_SHA" >/dev/null; then
            echo 'Release source is not on the protected default branch first-parent history.' >&2
            exit 1
          fi
          mapfile -t tags < <(git tag --points-at "$SOURCE_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [[ "${#tags[@]}" -eq 0 ]]; then
            echo 'No semantic release tag points at this successful default-branch build; publication is not eligible.'
            exit 0
          fi
          if [[ "${#tags[@]}" -ne 1 ]]; then
            echo "Expected one semantic release tag at $SOURCE_SHA, found ${#tags[@]}." >&2
            exit 1
          fi
          release_tag="${tags[0]}"
          remote_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq '.object.sha')"
          test "$remote_tag_sha" = "$SOURCE_SHA"
          release_version="${release_tag#v}"
          source_package_version="$(git show "$SOURCE_SHA:package.json" | jq -r '.version')"
          source_tauri_version="$(git show "$SOURCE_SHA:src-tauri/tauri.conf.json" | jq -r '.version')"
          test "$source_package_version" = "$release_version"
          test "$source_tauri_version" = "$release_version"
          build_workflow_sha256="$(git show "$SOURCE_SHA:.github/workflows/build.yml" | sha256sum | cut -d' ' -f1)"
          release_date="$(git show -s --format=%cI "$SOURCE_SHA")"
          {
            echo "eligible=true"
            echo "release_tag=$release_tag"
            echo "release_version=$release_version"
            echo "release_date=$release_date"
            echo "source_sha=$SOURCE_SHA"
            echo "publisher_sha=$PUBLISHER_SHA"
            echo "build_workflow_sha256=$build_workflow_sha256"
          } >> "$GITHUB_OUTPUT"

  rebuild-windows:
    needs: qualify
    if: needs.qualify.outputs.eligible == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.qualify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build exact-source Windows release without protected secrets
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ needs.qualify.outputs.source_sha }}') { throw 'source checkout mismatch' }
          node scripts/check-npm-supply-chain.cjs
          npm ci --ignore-scripts
          npm rebuild esbuild
          npm run build
          $keyPath = Join-Path $env:RUNNER_TEMP 'ephemeral-updater.key'
          npm run tauri signer generate -- --ci --force --password ephemeral-release-rebuild --write-keys $keyPath *> $null
          $env:TAURI_SIGNING_PRIVATE_KEY = $keyPath
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 'ephemeral-release-rebuild'
          npm run tauri build -- --config src-tauri/tauri.updater.conf.json
          $destination = Join-Path $env:RUNNER_TEMP 'protected-windows'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $payloads = @(
            Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File
            Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -File
          )
          if ($payloads.Count -ne 2 -or @($payloads | Where-Object Extension -eq '.exe').Count -ne 1 -or @($payloads | Where-Object Extension -eq '.msi').Count -ne 1) {
            throw "Expected exactly one NSIS and one MSI payload, found $($payloads.Count)"
          }
          foreach ($payload in $payloads) { Copy-Item -LiteralPath $payload.FullName -Destination $destination }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protected-updater-windows
          path: ${{ runner.temp }}/protected-windows/
          if-no-files-found: error
          retention-days: 3

  stage:
    needs: [qualify, rebuild-windows, rebuild-macos, rebuild-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.qualify.outputs.publisher_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protected-updater-windows
          path: updater-input/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protected-macos
          path: protected-macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protected-linux-x86_64
          path: release-input/linux-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protected-linux-aarch64
          path: release-input/linux-aarch64
      - name: Stage fixed-name inert release inputs at the immutable publisher revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.qualify.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.qualify.outputs.release_version }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          PUBLISHER_SHA: ${{ needs.qualify.outputs.publisher_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUBLISHER_SHA"
          mkdir -p updater-input/macos release-input/macos
          cp protected-macos/updater/* updater-input/macos/
          cp protected-macos/manual/* release-input/macos/
          node scripts/prepare-updater-release.mjs --stage
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq '.body' > updater-notes.md
          test -s updater-notes.md
          destination="manual-downloads/$RELEASE_TAG"
          mkdir -p "$destination"
          expected=(
            "release-input/macos/LlamaServerManager_${RELEASE_VERSION}_aarch64-adhoc.dmg"
            "release-input/linux-x86_64/LlamaServerManager_${RELEASE_VERSION}_amd64.deb"
            "release-input/linux-aarch64/LlamaServerManager_${RELEASE_VERSION}_arm64.deb"
          )
          for source in "${expected[@]}"; do test -s "$source"; cp "$source" "$destination/"; done
          mkdir release-stage
          cp -R updater-publish manual-downloads release-stage/
          cp updater-notes.md release-stage/
          printf '%s\n' "$SOURCE_SHA" > release-stage/SOURCE_SHA
          printf '%s\n' "$PUBLISHER_SHA" > release-stage/PUBLISHER_SHA
          printf '%s\n' "$RELEASE_TAG" > release-stage/RELEASE_TAG
          printf '%s\n' '${{ needs.qualify.outputs.release_date }}' > release-stage/RELEASE_DATE
          printf '%s\n' '${{ needs.qualify.outputs.build_workflow_sha256 }}' > release-stage/BUILD_WORKFLOW_SHA256
          (cd release-stage && find . -type f ! -name STAGED_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > release-stage/STAGED_SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protected-release-stage
          path: release-stage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  rebuild-macos:
    needs: qualify
    if: needs.qualify.outputs.eligible == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.qualify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build exact-source macOS release without protected secrets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.qualify.outputs.source_sha }}'
          node scripts/check-npm-supply-chain.cjs
          npm ci --ignore-scripts
          npm rebuild esbuild
          npm run build
          key_path="$RUNNER_TEMP/ephemeral-updater.key"
          npm run tauri signer generate -- --ci --force --password ephemeral-release-rebuild --write-keys "$key_path" >/dev/null
          export TAURI_SIGNING_PRIVATE_KEY="$key_path"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ephemeral-release-rebuild
          npm run tauri build -- --config src-tauri/tauri.updater.conf.json
          mkdir -p "$RUNNER_TEMP/protected-macos/updater" "$RUNNER_TEMP/protected-macos/manual"
          updater=()
          while IFS= read -r item; do updater+=("$item"); done < <(find src-tauri/target/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz')
          dmg=()
          while IFS= read -r item; do dmg+=("$item"); done < <(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg')
          test "${#updater[@]}" -eq 1
          test "${#dmg[@]}" -eq 1
          cp "${updater[0]}" "$RUNNER_TEMP/protected-macos/updater/"
          printf 'darwin-aarch64\n' > "$RUNNER_TEMP/protected-macos/updater/platform.txt"
          cp "${dmg[0]}" "$RUNNER_TEMP/protected-macos/manual/LlamaServerManager_${{ needs.qualify.outputs.release_version }}_aarch64-adhoc.dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protected-macos
          path: ${{ runner.temp }}/protected-macos/
          if-no-files-found: error
          retention-days: 3

  rebuild-linux:
    needs: qualify
    if: needs.qualify.outputs.eligible == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: protected-linux-x86_64
            package_arch: amd64
          - runner: ubuntu-24.04-arm
            artifact: protected-linux-aarch64
            package_arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.qualify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Linux package dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build exact-source Linux release without protected secrets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.qualify.outputs.source_sha }}'
          node scripts/check-npm-supply-chain.cjs
          npm ci --ignore-scripts
          npm rebuild esbuild
          npm run build
          npm run tauri build -- --bundles deb
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb')
          test "${#packages[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/protected-linux"
          cp "${packages[0]}" "$RUNNER_TEMP/protected-linux/LlamaServerManager_${{ needs.qualify.outputs.release_version }}_${{ matrix.package_arch }}.deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/protected-linux/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [qualify, stage]
    runs-on: ubuntu-latest
    environment: release-r2
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.qualify.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.qualify.outputs.release_version }}
      SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      PUBLISHER_SHA: ${{ needs.qualify.outputs.publisher_sha }}
      RELEASE_DATE: ${{ needs.qualify.outputs.release_date }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protected-release-stage
          path: release-stage
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
      - name: Verify immutable staged inputs before any secret use
        working-directory: release-stage
        run: |
          set -euo pipefail
          test "$(cat SOURCE_SHA)" = "$SOURCE_SHA"
          test "$(cat PUBLISHER_SHA)" = "$PUBLISHER_SHA"
          test "$(cat RELEASE_TAG)" = "$RELEASE_TAG"
          test "$(cat RELEASE_DATE)" = "$RELEASE_DATE"
          sha256sum --check STAGED_SHA256SUMS
      - name: Install exact integrity-pinned Tauri signer without repository code
        run: |
          set -euo pipefail
          mkdir -p signer/node_modules/@tauri-apps/cli signer/node_modules/@tauri-apps/cli-linux-x64-gnu
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://registry.npmjs.org/@tauri-apps/cli/-/cli-2.11.3.tgz -o cli.tgz
          echo '1049507bccfcb83ecf8b9fbeb49fd47c4c16b8ad3caddde808361d7886c901bea9651af196a9a8179821e47e58bf39943e14b821109a2d2b1086f5a4adf2be19  cli.tgz' | sha512sum --check -
          tar -xzf cli.tgz --strip-components=1 -C signer/node_modules/@tauri-apps/cli
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://registry.npmjs.org/@tauri-apps/cli-linux-x64-gnu/-/cli-linux-x64-gnu-2.11.3.tgz -o cli-platform.tgz
          echo 'faedc73bf177807c0be3cb7d81637fbaba99be96842730459936aae5e48886fcbc4cebe785bf8b809af7437046fb9271b81ac2523aad384cfa80cb6d74915204  cli-platform.tgz' | sha512sum --check -
          tar -xzf cli-platform.tgz --strip-components=1 -C signer/node_modules/@tauri-apps/cli-linux-x64-gnu
          rm cli.tgz cli-platform.tgz
          test "$(node signer/node_modules/@tauri-apps/cli/tauri.js --version)" = 'tauri-cli 2.11.3'
      - name: Re-query run and tag immediately before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '[.path,.status,.conclusion,.head_sha] | @tsv')"
          test "$run_metadata" = $'.github/workflows/build.yml\tcompleted\tsuccess\t'"$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
      - name: Sign exact rebuilt updater payloads and release envelope
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          release_root="release-stage/updater-publish/releases/$RELEASE_TAG"
          mapfile -t payloads < <(find "$release_root" -maxdepth 1 -type f ! -name '*.sig' | sort)
          test "${#payloads[@]}" -eq 3
          for payload in "${payloads[@]}"; do
            node signer/node_modules/@tauri-apps/cli/tauri.js signer sign -- "$payload"
            test -s "$payload.sig"
          done
          export UPDATER_OUTPUT_DIR="$PWD/release-stage/updater-publish"
          export UPDATER_NOTES_FILE="$PWD/release-stage/updater-notes.md"
          export R2_PUBLIC_BASE_URL='https://updates.cnzone.net'
          export SOURCE_SHA RELEASE_TAG RELEASE_VERSION RELEASE_DATE
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto'
          import fs from 'node:fs'
          import path from 'node:path'
          const root = process.env.UPDATER_OUTPUT_DIR
          const map = JSON.parse(fs.readFileSync(path.join(root, '.release-map.json'), 'utf8'))
          const keys = Object.keys(map)
          const darwin = keys.filter(key => /^darwin-(aarch64|x86_64)$/.test(key))
          if (keys.length !== 3 || darwin.length !== 1 || !map['windows-x86_64-nsis'] || !map['windows-x86_64-msi']) throw new Error('invalid release map')
          const parts = process.env.RELEASE_VERSION.split('.').map(Number)
          if (parts.length !== 3 || parts.some(n => !Number.isSafeInteger(n) || n < 0 || n > 999999)) throw new Error('invalid release version')
          const releaseCounter = parts[0] * 1000000000000 + parts[1] * 1000000 + parts[2]
          if (!Number.isSafeInteger(releaseCounter) || releaseCounter <= 0) throw new Error('release counter exceeds the signed updater range')
          const platforms = {}
          for (const target of ['windows-x86_64-nsis', 'windows-x86_64-msi', darwin[0]]) {
            const name = map[target]
            if (name !== path.basename(name)) throw new Error('invalid payload basename')
            const payload = path.join(root, 'releases', process.env.RELEASE_TAG, name)
            const signature = fs.readFileSync(payload + '.sig', 'utf8').trim()
            platforms[target] = {
              url: 'https://updates.cnzone.net/releases/' + process.env.RELEASE_TAG + '/' + encodeURIComponent(name),
              signature,
              sha256: crypto.createHash('sha256').update(fs.readFileSync(payload)).digest('hex'),
            }
          }
          const envelope = {
            version: process.env.RELEASE_VERSION,
            notes: fs.readFileSync(process.env.UPDATER_NOTES_FILE, 'utf8').trim(),
            pub_date: process.env.RELEASE_DATE,
            release_tag: process.env.RELEASE_TAG,
            source_sha: process.env.SOURCE_SHA,
            release_counter: releaseCounter,
            platforms,
          }
          fs.writeFileSync(path.join(root, 'release-envelope.json'), JSON.stringify(envelope) + '\n')
          NODE
          node signer/node_modules/@tauri-apps/cli/tauri.js signer sign -- release-stage/updater-publish/release-envelope.json
          test -s release-stage/updater-publish/release-envelope.json.sig
      - name: Assemble one atomic signed updater document
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const root = 'release-stage/updater-publish'
          const signedEnvelope = fs.readFileSync(root + '/release-envelope.json', 'utf8')
          const envelope = JSON.parse(signedEnvelope)
          const envelopeSignature = fs.readFileSync(root + '/release-envelope.json.sig', 'utf8').trim()
          fs.writeFileSync(root + '/latest.json', JSON.stringify({
            ...envelope,
            signed_envelope: signedEnvelope,
            envelope_signature: envelopeSignature,
          }) + '\n')
          NODE
      - name: Verify exact signed release member set
        run: |
          set -euo pipefail
          mapfile -t updater < <(find "release-stage/updater-publish/releases/$RELEASE_TAG" -maxdepth 1 -type f | sort)
          test "${#updater[@]}" -eq 6
          mapfile -t manual < <(find "release-stage/manual-downloads/$RELEASE_TAG" -maxdepth 1 -type f | sort)
          test "${#manual[@]}" -eq 3
          test -s release-stage/updater-publish/release-envelope.json
          test -s release-stage/updater-publish/release-envelope.json.sig
          test -s release-stage/updater-publish/latest.json
      - name: Publish exact GitHub Release assets without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file release-stage/updater-notes.md
          fi
          mapfile -t updater < <(find "release-stage/updater-publish/releases/$RELEASE_TAG" -maxdepth 1 -type f | sort)
          mapfile -t manual < <(find "release-stage/manual-downloads/$RELEASE_TAG" -maxdepth 1 -type f | sort)
          assets=("${updater[@]}" "${manual[@]}" release-stage/updater-publish/release-envelope.json release-stage/updater-publish/release-envelope.json.sig release-stage/updater-publish/latest.json)
          test "${#assets[@]}" -eq 12
          declare -A expected=()
          for asset in "${assets[@]}"; do
            test -s "$asset"
            name="$(basename "$asset")"
            test -z "${expected[$name]:-}"
            expected[$name]="$asset"
          done
          mapfile -t remote_names < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for name in "${remote_names[@]}"; do
            if [[ -z "${expected[$name]:-}" ]]; then echo "Unexpected existing release asset: $name" >&2; exit 1; fi
          done
          existing_dir="$(mktemp -d)"
          missing=()
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            if printf '%s\n' "${remote_names[@]}" | grep -Fxq "$name"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$existing_dir"
              cmp "$asset" "$existing_dir/$name"
              rm "$existing_dir/$name"
            else
              missing+=("$asset")
            fi
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          for asset in "${missing[@]}"; do gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"; done
          rm -rf -- "$existing_dir"
      - name: Publish immutable R2 objects and atomically advance updater state
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [[ -z "$(printenv "$name")" ]]; then echo "Missing protected release secret: $name" >&2; exit 1; fi
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          candidate="release-stage/updater-publish/latest.json"
          candidate_sha="$(sha256sum "$candidate" | cut -d' ' -f1)"
          state_file="$(mktemp)"
          current_manifest="$(mktemp)"
          state_etag=''
          latest_etag=''
          if state_etag="$(aws s3api head-object --bucket "$R2_BUCKET" --key release-state.json --endpoint-url "$R2_ENDPOINT" --query ETag --output text 2>/dev/null)"; then
            aws s3 cp "s3://$R2_BUCKET/release-state.json" "$state_file" --endpoint-url "$R2_ENDPOINT" >/dev/null
          else
            : > "$state_file"
          fi
          if latest_etag="$(aws s3api head-object --bucket "$R2_BUCKET" --key latest.json --endpoint-url "$R2_ENDPOINT" --query ETag --output text 2>/dev/null)"; then
            aws s3 cp "s3://$R2_BUCKET/latest.json" "$current_manifest" --endpoint-url "$R2_ENDPOINT" >/dev/null
          else
            : > "$current_manifest"
          fi
          export CANDIDATE_SHA="$candidate_sha" STATE_FILE="$state_file" CURRENT_MANIFEST="$current_manifest"
          node --input-type=module <<'NODE' > publish-decision
          import crypto from 'node:crypto'
          import fs from 'node:fs'
          const candidate = JSON.parse(fs.readFileSync('release-stage/updater-publish/latest.json', 'utf8'))
          const stateText = fs.readFileSync(process.env.STATE_FILE, 'utf8')
          const currentText = fs.readFileSync(process.env.CURRENT_MANIFEST, 'utf8')
          const state = stateText ? JSON.parse(stateText) : null
          const current = currentText ? JSON.parse(currentText) : null
          const parse = value => {
            if (typeof value !== 'string' || !/^\d+\.\d+\.\d+$/.test(value)) throw new Error('invalid release version')
            const parts = value.split('.').map(Number)
            if (parts.some(n => !Number.isSafeInteger(n) || n < 0 || n > 999999)) throw new Error('release version component is out of range')
            return parts
          }
          const compare = (a, b) => {
            const av = parse(a), bv = parse(b)
            for (let i = 0; i < 3; i++) if (av[i] !== bv[i]) return av[i] > bv[i] ? 1 : -1
            return 0
          }
          const currentHash = currentText ? crypto.createHash('sha256').update(currentText).digest('hex') : null
          if (state && (!/^[0-9a-f]{64}$/.test(state.manifest_sha256) || !state.version)) throw new Error('invalid authenticated release state')
          if (state && currentHash !== state.manifest_sha256) {
            if (currentHash === process.env.CANDIDATE_SHA && compare(candidate.version, state.version) > 0) {
              console.log('recover')
              process.exit(0)
            }
            throw new Error('current updater manifest does not match authenticated release state')
          }
          const floor = state?.version ?? current?.version
          if (!floor) {
            console.log('publish')
          } else {
            const order = compare(candidate.version, floor)
            if (order < 0) throw new Error('refusing updater rollback')
            if (order === 0) {
              if (currentHash !== process.env.CANDIDATE_SHA) throw new Error('equal-version retry is not byte-identical')
              console.log(state?.manifest_sha256 === process.env.CANDIDATE_SHA ? 'idempotent' : 'recover')
            } else {
              console.log('publish')
            }
          }
          NODE
          decision="$(cat publish-decision)"
          publish_immutable() {
            local source="$1" prefix="$2" name remote
            name="$(basename "$source")"
            remote="$(mktemp)"
            if aws s3 cp "s3://$R2_BUCKET/$prefix/$name" "$remote" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
              cmp "$source" "$remote"
            else
              aws s3api put-object --bucket "$R2_BUCKET" --key "$prefix/$name" --body "$source" --cache-control 'public,max-age=31536000,immutable' --if-none-match '*' --endpoint-url "$R2_ENDPOINT" >/dev/null
            fi
            aws s3 cp "s3://$R2_BUCKET/$prefix/$name" "$remote" --endpoint-url "$R2_ENDPOINT" >/dev/null
            cmp "$source" "$remote"
            rm "$remote"
          }
          while IFS= read -r -d '' file; do publish_immutable "$file" "releases/$RELEASE_TAG"; done < <(find "release-stage/updater-publish/releases/$RELEASE_TAG" -maxdepth 1 -type f -print0)
          publish_immutable release-stage/updater-publish/release-envelope.json "releases/$RELEASE_TAG"
          publish_immutable release-stage/updater-publish/release-envelope.json.sig "releases/$RELEASE_TAG"
          while IFS= read -r -d '' file; do publish_immutable "$file" "downloads/$RELEASE_TAG"; done < <(find "release-stage/manual-downloads/$RELEASE_TAG" -maxdepth 1 -type f -print0)
          if [[ "$decision" = publish ]]; then
            if [[ -n "$latest_etag" ]]; then
              aws s3api put-object --bucket "$R2_BUCKET" --key latest.json --body "$candidate" --content-type 'application/json; charset=utf-8' --cache-control 'no-cache, max-age=0, must-revalidate' --if-match "$latest_etag" --endpoint-url "$R2_ENDPOINT" >/dev/null
            else
              aws s3api put-object --bucket "$R2_BUCKET" --key latest.json --body "$candidate" --content-type 'application/json; charset=utf-8' --cache-control 'no-cache, max-age=0, must-revalidate' --if-none-match '*' --endpoint-url "$R2_ENDPOINT" >/dev/null
            fi
          fi
          if [[ "$decision" != idempotent ]]; then
            export GITHUB_RUN_ID RELEASE_TAG SOURCE_SHA PUBLISHER_SHA RELEASE_VERSION
            node --input-type=module <<'NODE'
            import fs from 'node:fs'
            fs.writeFileSync('release-state-next.json', JSON.stringify({
              version: process.env.RELEASE_VERSION,
              release_tag: process.env.RELEASE_TAG,
              source_sha: process.env.SOURCE_SHA,
              publisher_sha: process.env.PUBLISHER_SHA,
              workflow_run_id: process.env.GITHUB_RUN_ID,
              manifest_sha256: process.env.CANDIDATE_SHA,
            }) + '\n')
            NODE
            if [[ -n "$state_etag" ]]; then
              aws s3api put-object --bucket "$R2_BUCKET" --key release-state.json --body release-state-next.json --content-type 'application/json; charset=utf-8' --cache-control 'no-store' --if-match "$state_etag" --endpoint-url "$R2_ENDPOINT" >/dev/null
            else
              aws s3api put-object --bucket "$R2_BUCKET" --key release-state.json --body release-state-next.json --content-type 'application/json; charset=utf-8' --cache-control 'no-store' --if-none-match '*' --endpoint-url "$R2_ENDPOINT" >/dev/null
            fi
          fi
          remote_manifest="$(mktemp)"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://updates.cnzone.net/latest.json --output "$remote_manifest"
          cmp "$candidate" "$remote_manifest"
          rm -f "$state_file" "$current_manifest" "$remote_manifest"
      - name: Remove transient signer and release staging
        if: always()
        run: rm -rf -- signer release-stage
