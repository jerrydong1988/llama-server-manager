name: AppImage Candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/appimage-candidate.yml'
      - 'scripts/appimage/**'
      - 'src-tauri/tauri.appimage-candidate.conf.json'
      - 'src-tauri/src/process_environment.rs'

permissions:
  contents: read

concurrency:
  group: appimage-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appimage-candidate:
    name: appimage-candidate-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, reviewed 2026-08-07
      - name: Check out the merged upstream bundler fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tauri-apps/tauri
          ref: 8e7028331ad37ac2db74d4ec20e66be5cacf2c40 # tauri-apps/tauri#16062
          path: .temp/appimage-tauri
          persist-credentials: false
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri
            .temp/appimage-tauri
          key: appimage-candidate-16062-${{ matrix.arch }}
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2t64 file desktop-file-utils
      - name: Verify and install frontend dependencies
        run: |
          node scripts/check-npm-supply-chain.cjs
          npm ci --ignore-scripts
          npm rebuild esbuild
          node scripts/check-npm-supply-chain.cjs --installed-only
      - name: Build the pinned candidate CLI
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '0'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_DEBUG: '0'
        run: |
          test "$(git -C .temp/appimage-tauri rev-parse HEAD)" = 8e7028331ad37ac2db74d4ec20e66be5cacf2c40
          cargo build --manifest-path .temp/appimage-tauri/Cargo.toml --package tauri-cli --bin cargo-tauri --release --locked
      - name: Test Linux process isolation
        run: |
          rustc --edition=2021 --test src-tauri/src/process_environment.rs -o "$RUNNER_TEMP/appimage-process-environment-tests"
          "$RUNNER_TEMP/appimage-process-environment-tests"
      - name: Build AppImage candidate
        env:
          CANDIDATE_ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/appimage/prepare-tools.py
          .temp/appimage-tauri/target/release/cargo-tauri build --ci --config src-tauri/tauri.appimage-candidate.conf.json --bundles appimage -- --locked
      - name: Inspect the final package and prepare handoff
        env:
          CANDIDATE_ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/appimage/inspect-candidate.py
      - name: Upload candidate and verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appimage-candidate-${{ matrix.arch }}-${{ github.run_number }}
          path: .temp/appimage-candidate/
          if-no-files-found: error
          retention-days: 30
