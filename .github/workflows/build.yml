name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, reviewed 2026-08-07
        with:
          components: clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Verify npm dependency supply chain
        run: node scripts/check-npm-supply-chain.cjs
      - name: Install reviewed dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Scan installed dependencies for ChainDrop indicators
        run: node scripts/check-npm-supply-chain.cjs --installed-only
      - name: Install browser regression runtime
        run: node node_modules/playwright/cli.js install chromium
      - name: Validate release
        run: npm run check:release
      - name: Build frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Audit Rust dependencies
        # Tauri 2 still depends on the upstream GTK3 stack on Linux, while
        # tauri-utils 2.9 uses urlpattern 0.3. Keep these exact advisories
        # visible here until their upstream migrations land. The matching
        # metadata and expiry live in .github/rustsec-allowlist.json; new
        # advisories remain unignored and therefore block the release.
        uses: RustSec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          ignore: RUSTSEC-2024-0370,RUSTSEC-2024-0411,RUSTSEC-2024-0412,RUSTSEC-2024-0413,RUSTSEC-2024-0414,RUSTSEC-2024-0415,RUSTSEC-2024-0416,RUSTSEC-2024-0417,RUSTSEC-2024-0418,RUSTSEC-2024-0419,RUSTSEC-2024-0420,RUSTSEC-2024-0429,RUSTSEC-2025-0075,RUSTSEC-2025-0080,RUSTSEC-2025-0081,RUSTSEC-2025-0098,RUSTSEC-2025-0100
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

  build-windows:
    needs: quality
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, reviewed 2026-08-07
        with:
          components: clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Verify npm dependency supply chain
        run: node scripts/check-npm-supply-chain.cjs
      - name: Install reviewed dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Scan installed dependencies for ChainDrop indicators
        run: node scripts/check-npm-supply-chain.cjs --installed-only
      - name: Build frontend for Tauri context
        run: npm run build
      - name: Test Rust on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust on Windows
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Build independent runtime smoke binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - name: Test independent runtime lifecycle on Windows
        run: npm run test:runtime-service
      - name: Validate user guide
        run: npm run check:guide
      - name: Detect SignPath configuration
        id: signpath
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = 'SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_SIGNING_POLICY_SLUG','SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $message = "SignPath is not configured; publishing unsigned Windows installers. Missing: $($missing -join ', ')"
            Write-Output $message
            "### Windows signing`n`n$message" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "### Windows signing`n`nSignPath is configured; installers will be submitted for signing." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - name: Generate ephemeral updater packaging key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'updater-packaging.key'
          npm run tauri signer generate -- --ci --force --password ephemeral-updater-packaging-key --write-keys $keyPath *> $null
          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ephemeral-updater-packaging-key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Tauri
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build
      - name: Build Tauri release and updater payload
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
      - name: Upload unsigned Windows installers for signing
        id: upload-unsigned-windows
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Submit Windows installers to SignPath
        if: startsWith(github.ref, 'refs/tags/v') && steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed-windows
      - name: Prepare exact Windows updater payload
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'updater-windows'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          if ('${{ steps.signpath.outputs.enabled }}' -eq 'true') {
            $candidates = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'signed-windows') -Recurse -File | Where-Object { $_.Extension -in '.exe','.msi' })
            $unsigned = $false
          } else {
            $candidates = @(
              Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' -File
              Get-ChildItem -Path 'src-tauri/target/release/bundle/msi/*.msi' -File
            )
            $unsigned = $true
          }
          $exeCount = @($candidates | Where-Object Extension -eq '.exe').Count
          $msiCount = @($candidates | Where-Object Extension -eq '.msi').Count
          if ($candidates.Count -ne 2 -or $exeCount -ne 1 -or $msiCount -ne 1) {
            throw "Expected one NSIS and one MSI updater payload, found $($candidates.Count) Windows file(s)"
          }
          foreach ($candidate in $candidates) {
            $name = $candidate.Name
            if ($unsigned) {
              $name = "$([IO.Path]::GetFileNameWithoutExtension($name))-unsigned$([IO.Path]::GetExtension($name))"
            }
            Copy-Item -LiteralPath $candidate.FullName -Destination (Join-Path $destination $name)
          }
      - name: Upload Windows updater input
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: updater-windows
          path: ${{ runner.temp }}/updater-windows/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/

  build-macos:
    needs: quality
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, reviewed 2026-08-07
        with:
          components: clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Verify npm dependency supply chain
        run: node scripts/check-npm-supply-chain.cjs
      - name: Install reviewed dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Scan installed dependencies for ChainDrop indicators
        run: node scripts/check-npm-supply-chain.cjs --installed-only
      - name: Build frontend for Tauri context
        run: npm run build
      - name: Test Rust on macOS
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust on macOS
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Build independent runtime smoke binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - name: Test independent runtime lifecycle on macOS
        run: npm run test:runtime-service
      - name: Validate user guide
        run: npm run check:guide
      - name: Detect Apple signing configuration
        id: apple-signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            message="Apple signing credentials are incomplete; building an ad-hoc signed macOS package. Missing:$missing"
            echo "$message"
            printf '### macOS signing\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            printf '### macOS signing\n\nDeveloper ID signing and notarization are enabled.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate ephemeral updater packaging key
        run: |
          key_path="$RUNNER_TEMP/updater-packaging.key"
          npm run tauri signer generate -- --ci --force --password ephemeral-updater-packaging-key --write-keys "$key_path" >/dev/null
          echo "TAURI_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ephemeral-updater-packaging-key" >> "$GITHUB_ENV"
      - name: Import Apple signing certificate
        if: startsWith(github.ref, 'refs/tags/v') && steps.apple-signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          certificate_path="$RUNNER_TEMP/llama-server-manager.p12"
          keychain_path="$RUNNER_TEMP/llama-server-manager.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"
      - name: Build ad-hoc signed Tauri package and updater smoke payload
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
      - name: Build ad-hoc signed Tauri release and updater payload
        if: startsWith(github.ref, 'refs/tags/v') && steps.apple-signing.outputs.enabled != 'true'
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
      - name: Build signed and notarized Tauri release
        if: startsWith(github.ref, 'refs/tags/v') && steps.apple-signing.outputs.enabled == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
      - name: Prepare exact macOS updater payload
        run: |
          destination="$RUNNER_TEMP/updater-macos"
          mkdir -p "$destination"
          payload_count="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "$payload_count" -ne 1 ]; then
            echo "Expected exactly one macOS updater payload, found $payload_count" >&2
            exit 1
          fi
          payload="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' | head -n 1)"
          cp "$payload" "$destination/"
          case "$(uname -m)" in
            arm64) printf 'darwin-aarch64\n' > "$destination/platform.txt" ;;
            x86_64) printf 'darwin-x86_64\n' > "$destination/platform.txt" ;;
            *) echo "Unsupported macOS runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
      - name: Upload macOS updater input
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: updater-macos
          path: ${{ runner.temp }}/updater-macos/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare exact macOS GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          destination="$RUNNER_TEMP/release-macos"
          mkdir -p "$destination"
          package_count="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d '[:space:]')"
          if [ "$package_count" -ne 1 ]; then
            echo "Expected exactly one macOS DMG, found $package_count" >&2
            exit 1
          fi
          package="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          if [ '${{ steps.apple-signing.outputs.enabled }}' = 'true' ]; then
            cp "$package" "$destination/"
          else
            base="$(basename "$package" .dmg)"
            cp "$package" "$destination/$base-adhoc.dmg"
          fi
      - name: Upload macOS GitHub release input
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos
          path: ${{ runner.temp }}/release-macos/
          if-no-files-found: error
          retention-days: 7
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-app
          path: src-tauri/target/release/bundle/
      - name: Remove temporary Apple signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/v') && steps.apple-signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/llama-server-manager.keychain-db" || true
          rm -f "$RUNNER_TEMP/llama-server-manager.p12"

  build-linux:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, reviewed 2026-08-07
        with:
          components: clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf || \
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf || \
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Verify npm dependency supply chain
        run: node scripts/check-npm-supply-chain.cjs
      - name: Install reviewed dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Scan installed dependencies for ChainDrop indicators
        run: node scripts/check-npm-supply-chain.cjs --installed-only
      - name: Build frontend for Tauri context
        run: npm run build
      - name: Test Rust on Linux x64
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust on Linux x64
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Build independent runtime smoke binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - name: Test independent runtime lifecycle on Linux x64
        run: npm run test:runtime-service
      - name: Validate user guide
        run: npm run check:guide
      - name: Build Linux x86_64 DEB package
        run: npm run tauri build -- --bundles deb
      - name: Upload Linux x86_64 GitHub release input
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux-x86_64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages
          path: src-tauri/target/release/bundle/

  build-linux-arm64:
    needs: quality
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
