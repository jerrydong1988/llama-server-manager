name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, reviewed 2026-08-07
        with:
          components: clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Verify npm dependency supply chain
        run: node scripts/check-npm-supply-chain.cjs
      - name: Install reviewed dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Scan installed dependencies for ChainDrop indicators
        run: node scripts/check-npm-supply-chain.cjs --installed-only
      - name: Install browser regression runtime
        run: node node_modules/playwright/cli.js install chromium
      - name: Validate release
        run: npm run check:release
      - name: Build frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Install read-only RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies without a write token
        # Tauri 2 still depends on the upstream GTK3 stack on Linux, while
        # tauri-utils 2.9 uses urlpattern 0.3. Keep these exact advisories
        # visible here until their upstream migrations land. The matching
        # metadata and expiry live in .github/rustsec-allowlist.json; new
        # advisories remain unignored and therefore block the release.
        run: >-
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2024-0411
          --ignore RUSTSEC-2024-0412
          --ignore RUSTSEC-2024-0413
          --ignore RUSTSEC-2024-0414
          --ignore RUSTSEC-2024-0415
          --ignore RUSTSEC-2024-0416
          --ignore RUSTSEC-2024-0417
          --ignore RUSTSEC-2024-0418
          --ignore RUSTSEC-2024-0419
          --ignore RUSTSEC-2024-0420
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2025-0075
          --ignore RUSTSEC-2025-0080
          --ignore RUSTSEC-2025-0081
          --ignore RUSTSEC-2025-0098
          --ignore RUSTSEC-2025-0100
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

  build-windows:
    needs: quality
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, reviewed 2026-08-07
        with:
          components: clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Verify npm dependency supply chain
        run: node scripts/check-npm-supply-chain.cjs
      - name: Install reviewed dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Scan installed dependencies for ChainDrop indicators
        run: node scripts/check-npm-supply-chain.cjs --installed-only
      - name: Build frontend for Tauri context
        run: npm run build
      - name: Test Rust on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust on Windows
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Build independent runtime smoke binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - name: Test independent runtime lifecycle on Windows
        run: npm run test:runtime-service
      - name: Test Headless CLI lifecycle on Windows
        run: npm run test:headless-cli
      - name: Validate user guide
        run: npm run check:guide
      - name: Generate ephemeral updater packaging key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'updater-packaging.key'
          npm run tauri signer generate -- --ci --force --password ephemeral-updater-packaging-key --write-keys $keyPath *> $null
          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ephemeral-updater-packaging-key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Tauri
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build
      - name: Build Tauri release and updater payload
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
      - name: Verify Headless CLI in Windows package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/msi/*.msi' -File)
          if ($packages.Count -ne 1) { throw "Expected one MSI package, found $($packages.Count)" }
          $destination = Join-Path $env:RUNNER_TEMP 'lsm-msi-layout'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $arguments = @('/a', "`"$($packages[0].FullName)`"", '/qn', "TARGETDIR=`"$destination`"")
          $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "MSI administrative extraction failed: $($process.ExitCode)" }
          $commands = @(Get-ChildItem -LiteralPath $destination -Recurse -File -Filter 'lsm.exe')
          if ($commands.Count -ne 1) { throw "Expected one packaged lsm.exe, found $($commands.Count)" }
          $version = & $commands[0].FullName --output json version | ConvertFrom-Json
          if (-not $version.ok -or $version.data.schemaVersion -ne 1) { throw 'Packaged lsm.exe contract check failed' }
          $agentHelp = & $commands[0].FullName worker-agent help
          if ($LASTEXITCODE -ne 0 -or ($agentHelp -join "`n") -notmatch 'secure Worker Agent') { throw 'Packaged lsm.exe Worker Agent check failed' }
      - name: Prepare exact Windows updater payload
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'updater-windows'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          # Signing credentials never enter tag-selected repository code. These
          # artifacts remain explicitly unsigned until a separately protected,
          # branch-pinned signing workflow is introduced.
          $candidates = @(
            Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' -File
            Get-ChildItem -Path 'src-tauri/target/release/bundle/msi/*.msi' -File
          )
          $unsigned = $true
          $exeCount = @($candidates | Where-Object Extension -eq '.exe').Count
          $msiCount = @($candidates | Where-Object Extension -eq '.msi').Count
          if ($candidates.Count -ne 2 -or $exeCount -ne 1 -or $msiCount -ne 1) {
            throw "Expected one NSIS and one MSI updater payload, found $($candidates.Count) Windows file(s)"
          }
          foreach ($candidate in $candidates) {
            $name = $candidate.Name
            if ($unsigned) {
              $name = "$([IO.Path]::GetFileNameWithoutExtension($name))-unsigned$([IO.Path]::GetExtension($name))"
            }
            Copy-Item -LiteralPath $candidate.FullName -Destination (Join-Path $destination $name)
          }
      - name: Upload Windows updater input
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: updater-windows
          path: ${{ runner.temp }}/updater-windows/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/

  build-macos:
    needs: quality
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, reviewed 2026-08-07
        with:
          components: clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Verify npm dependency supply chain
        run: node scripts/check-npm-supply-chain.cjs
      - name: Install reviewed dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Scan installed dependencies for ChainDrop indicators
        run: node scripts/check-npm-supply-chain.cjs --installed-only
      - name: Build frontend for Tauri context
        run: npm run build
      - name: Test Rust on macOS
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust on macOS
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Build independent runtime smoke binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - name: Test independent runtime lifecycle on macOS
        run: npm run test:runtime-service
      - name: Test Headless CLI lifecycle on macOS
        run: npm run test:headless-cli
      - name: Validate user guide
        run: npm run check:guide
      - name: Generate ephemeral updater packaging key
        run: |
          key_path="$RUNNER_TEMP/updater-packaging.key"
          npm run tauri signer generate -- --ci --force --password ephemeral-updater-packaging-key --write-keys "$key_path" >/dev/null
          echo "TAURI_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ephemeral-updater-packaging-key" >> "$GITHUB_ENV"
      - name: Build ad-hoc signed Tauri package and updater smoke payload
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
      - name: Build ad-hoc signed Tauri release and updater payload
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
      - name: Verify Headless CLI in macOS package
        run: |
          command_count="$(find src-tauri/target/release/bundle/macos -type f -path '*/Contents/MacOS/lsm' | wc -l | tr -d '[:space:]')"
          if [ "$command_count" -ne 1 ]; then
            echo "Expected one packaged macOS lsm, found $command_count" >&2
            exit 1
          fi
          command_path="$(find src-tauri/target/release/bundle/macos -type f -path '*/Contents/MacOS/lsm' | head -n 1)"
          test -x "$command_path"
          "$command_path" --output json version | grep -F '"schemaVersion": 1'
          "$command_path" worker-agent help | grep -F 'secure Worker Agent'
      - name: Prepare exact macOS updater payload
        run: |
          destination="$RUNNER_TEMP/updater-macos"
          mkdir -p "$destination"
          payload_count="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d '[:space:]')"
          if [ "$payload_count" -ne 1 ]; then
            echo "Expected exactly one macOS updater payload, found $payload_count" >&2
            exit 1
          fi
          payload="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' | head -n 1)"
          cp "$payload" "$destination/"
          case "$(uname -m)" in
            arm64) printf 'darwin-aarch64\n' > "$destination/platform.txt" ;;
            x86_64) printf 'darwin-x86_64\n' > "$destination/platform.txt" ;;
            *) echo "Unsupported macOS runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
      - name: Upload macOS updater input
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: updater-macos
          path: ${{ runner.temp }}/updater-macos/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare exact macOS GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          destination="$RUNNER_TEMP/release-macos"
          mkdir -p "$destination"
          package_count="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d '[:space:]')"
          if [ "$package_count" -ne 1 ]; then
            echo "Expected exactly one macOS DMG, found $package_count" >&2
            exit 1
          fi
          package="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          base="$(basename "$package" .dmg)"
          cp "$package" "$destination/$base-adhoc.dmg"
      - name: Upload macOS GitHub release input
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos
          path: ${{ runner.temp }}/release-macos/
          if-no-files-found: error
          retention-days: 7
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-app
          path: src-tauri/target/release/bundle/

  build-linux:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, reviewed 2026-08-07
        with:
          components: clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf || \
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf || \
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Verify npm dependency supply chain
        run: node scripts/check-npm-supply-chain.cjs
      - name: Install reviewed dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Scan installed dependencies for ChainDrop indicators
        run: node scripts/check-npm-supply-chain.cjs --installed-only
      - name: Build frontend for Tauri context
        run: npm run build
      - name: Test Rust on Linux x64
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust on Linux x64
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Build independent runtime smoke binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - name: Test independent runtime lifecycle on Linux x64
        run: npm run test:runtime-service
      - name: Test Headless CLI lifecycle on Linux x64
        run: npm run test:headless-cli
      - name: Validate user guide
        run: npm run check:guide
      - name: Build Linux x86_64 DEB package
        run: npm run tauri build -- --bundles deb
      - name: Verify Headless CLI in Linux x86_64 package
        run: |
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb')
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected one Linux x86_64 DEB, found ${#packages[@]}" >&2
            exit 1
          fi
          destination="$RUNNER_TEMP/lsm-deb-layout"
          dpkg-deb -x "${packages[0]}" "$destination"
          test -x "$destination/usr/bin/lsm"
          "$destination/usr/bin/lsm" --output json version | grep -F '"schemaVersion": 1'
          "$destination/usr/bin/lsm" worker-agent help | grep -F 'secure Worker Agent'
      - name: Upload Linux x86_64 GitHub release input
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux-x86_64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages
          path: src-tauri/target/release/bundle/

