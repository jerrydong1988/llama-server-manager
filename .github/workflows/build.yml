      - name: Build Tauri
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build
      - name: Build Tauri release and updater payload
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json
