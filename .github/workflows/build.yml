        with:
          name: release-linux-aarch64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-arm64-packages
          path: src-tauri/target/release/bundle/

  publish-updater:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    environment: release-r2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.0'
      - name: Verify npm dependency supply chain
        run: node scripts/check-npm-supply-chain.cjs
      - name: Install integrity-verified Tauri signer only
        run: node scripts/install-tauri-signer.cjs "$RUNNER_TEMP/tauri-signer"
      - name: Scan Tauri signer for ChainDrop indicators
        run: node scripts/check-npm-supply-chain.cjs --installed-only --node-modules "$RUNNER_TEMP/tauri-signer/node_modules"
      - name: Download Windows updater input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: updater-windows
          path: updater-input/windows
      - name: Download macOS updater input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: updater-macos
          path: updater-input/macos
      - name: Download macOS GitHub release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-macos
          path: release-input/macos
      - name: Download Linux x86_64 GitHub release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-linux-x86_64
          path: release-input/linux-x86_64
      - name: Download Linux ARM64 GitHub release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-linux-aarch64
          path: release-input/linux-aarch64
      - name: Validate protected updater secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          missing=()
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_BASE_URL; do
            if [ -z "$(printenv "$name")" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing protected release-r2 secret(s): ${missing[*]}" >&2
            exit 1
          fi
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes ''
          fi
      - name: Ensure release notes are present before manifest generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
          if [[ -n "${body//[[:space:]]/}" ]]; then
            echo "Release notes already exist; preserving the curated content."
            exit 0
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq '.body' > generated-release-notes.md
          test -s generated-release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file generated-release-notes.md
      - name: Read curated release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > updater-notes.md
      - name: Stage updater payloads
        run: node scripts/prepare-updater-release.mjs --stage
      - name: Sign exact updater payloads
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          while IFS= read -r -d '' payload; do
            node "$RUNNER_TEMP/tauri-signer/node_modules/@tauri-apps/cli/tauri.js" signer sign -- "$payload"
            test -s "$payload.sig"
          done < <(find "updater-publish/releases/$GITHUB_REF_NAME" -maxdepth 1 -type f ! -name '*.sig' -print0)
      - name: Remove temporary Tauri signer
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/tauri-signer"
      - name: Create signed updater manifest
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          UPDATER_NOTES_FILE: updater-notes.md
        run: node scripts/prepare-updater-release.mjs --manifest
      - name: Upload updater backup assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find "updater-publish/releases/$GITHUB_REF_NAME" -maxdepth 1 -type f -print0)
          assets+=("updater-publish/latest.json")
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Upload exact platform packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find updater-input/windows release-input -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \) -print0)
          if [ "${#assets[@]}" -ne 5 ]; then
            echo "Expected exactly five GitHub release packages, found ${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Stage manual download packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          destination="manual-downloads/$GITHUB_REF_NAME"
          mkdir -p "$destination"
          expected=(
            "LlamaServerManager_${version}_aarch64-adhoc.dmg"
            "LlamaServerManager_${version}_amd64.deb"
            "LlamaServerManager_${version}_arm64.deb"
          )
          for name in "${expected[@]}"; do
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$destination"
            test -s "$destination/$name"
          done
      - name: Publish immutable updater payloads to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws --version
          aws s3 cp "updater-publish/releases/$GITHUB_REF_NAME/" "s3://$R2_BUCKET/releases/$GITHUB_REF_NAME/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp "manual-downloads/$GITHUB_REF_NAME/" "s3://$R2_BUCKET/downloads/$GITHUB_REF_NAME/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control 'public,max-age=31536000,immutable'
          while IFS= read -r -d '' file; do
            remote_file="$(mktemp)"
            aws s3 cp "s3://$R2_BUCKET/downloads/$GITHUB_REF_NAME/$(basename "$file")" "$remote_file" \
              --endpoint-url "$R2_ENDPOINT"
            cmp "$file" "$remote_file"
            rm -f "$remote_file"
          done < <(find "manual-downloads/$GITHUB_REF_NAME" -maxdepth 1 -type f -print0)
      - name: Publish updater manifest to R2 last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          aws s3 cp updater-publish/latest.json "s3://$R2_BUCKET/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-cache, max-age=0, must-revalidate'
          remote_manifest="$(mktemp)"
          curl --fail --silent --show-error --location "$R2_PUBLIC_BASE_URL/latest.json" --output "$remote_manifest"
          cmp updater-publish/latest.json "$remote_manifest"

  finalize-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux, build-linux-arm64, publish-updater]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure release notes are present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
          if [[ -n "${body//[[:space:]]/}" ]]; then
            echo "Release notes already exist; preserving the curated content."
            exit 0
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$tag" \
            --jq '.body' > generated-release-notes.md
          test -s generated-release-notes.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file generated-release-notes.md
