[package]
name = "llama-server-manager"
version = "2.9.50"
description = "现代化 Llama.cpp 服务器图形化管理器"
authors = ["开发者"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-process = "2.3"
tauri-plugin-shell = "2.3"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
walkdir = "2.0"
bytes = "1.0"
futures-util = "0.3"
fs2 = "0.4"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
tokio-util = { version = "0.7", features = ["codec", "io"] }
sysinfo = "0.32"
libloading = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex-lite = "0.1"
if-addrs = "0.13"
socket2 = "0.5"
mdns-sd = "0.20"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
axum = "0.7"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
urlpattern = "0.3"
glib-macros = "0.18"
gtk3-macros = "0.18"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18"

# The GLib pointer regression manifested under optimization. Keep that dependency
# optimized in debug/test builds as well as release builds.
[profile.dev.package.glib]
opt-level = 2

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# ABI-compatible security backports; see vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
glib-macros = { path = "vendor/glib-macros-0.18.5" }
gtk3-macros = { path = "vendor/gtk3-macros-0.18.2" }
urlpattern = { path = "vendor/urlpattern-0.3.0" }
